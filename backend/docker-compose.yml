name: spotify-wrapper-backend

services:
  postgres:
    image: postgres:15-alpine
    container_name: spotify_postgres
    environment:
      # interpolated from backend/.env when you run compose from backend/ (same file the app uses).
      POSTGRES_USER: ${POSTGRES_USER:-spotify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spotify_password}
      POSTGRES_DB: ${POSTGRES_DB:-spotify_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # default DB name would match the user (spotify_user) POSTGRES_DB is spotify_db
      test: ["CMD-SHELL", "pg_isready -U spotify_user -d spotify_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: spotify_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data: